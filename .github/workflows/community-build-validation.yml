name: Community Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  community-boundaries:
    name: Community build boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Verify Community default build loop
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts ?? {};
          const forbidden = [];

          for (const [name, command] of Object.entries(scripts)) {
            if (/extensions\/copilot|compile-copilot|watch-copilot|copilot:setup|copilot:get_token/i.test(`${name} ${command}`)) {
              forbidden.push(`${name}: ${command}`);
            }
          }

          if (forbidden.length) {
            console.error('Community Edition default scripts still contain Copilot-specific build/watch entrypoints:');
            for (const item of forbidden) console.error(`  - ${item}`);
            process.exit(1);
          }

          console.log('Community default build/watch scripts contain no Copilot-specific entrypoints.');
          NODE

  linux-build:
    name: Linux compile and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config \
            libxkbfile-dev \
            libkrb5-dev \
            libsecret-1-dev \
            libgtk-3-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libnss3-dev \
            libasound2-dev

      - name: Install root dependencies
        shell: bash
        run: |
          set -euo pipefail
          source ./build/azure-pipelines/linux/setup-env.sh
          npm ci
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck client
        run: npm run typecheck-client

      - name: Compile Community Edition
        run: npm run compile

      - name: Validate architectural layers
        run: npm run valid-layers-check

      - name: Verify install did not rewrite tracked files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::Dependency install or build modified tracked files. Commit the generated changes or fix the build."
            exit 1
          fi
