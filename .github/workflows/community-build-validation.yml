name: Community Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  community-boundaries:
    name: Community build boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Verify Community product and packaging boundaries
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const product = JSON.parse(fs.readFileSync('product.json', 'utf8'));
          const scripts = pkg.scripts ?? {};
          const forbidden = [];

          const expectedExtensions = [
            'configuration-editing', 'csharp', 'debug-auto-launch', 'debug-server-ready',
            'diff', 'dotenv', 'git', 'git-base', 'ini', 'json', 'json-language-features',
            'log', 'markdown-basics', 'markdown-language-features', 'media-preview',
            'merge-conflict', 'pcl-community', 'powershell', 'references-view',
            'search-result', 'shellscript', 'terminal-suggest', 'theme-defaults',
            'theme-modern-icons', 'xml', 'yaml'
          ];
          const extensionBuildSource = fs.readFileSync('build/lib/extensions.ts', 'utf8');
          const allowlistBlock = extensionBuildSource.match(/export const communityExtensions = \[([\s\S]*?)\];/);
          const actualExtensions = allowlistBlock ? [...allowlistBlock[1].matchAll(/'([^']+)'/g)].map(match => match[1]) : [];
          if (JSON.stringify(actualExtensions) !== JSON.stringify(expectedExtensions)) {
            console.error('Community built-in extension allowlist changed unexpectedly.');
            console.error({ expectedExtensions, actualExtensions });
            process.exit(1);
          }

          for (const dependency of ['@github/copilot', '@github/copilot-sdk', '@vscode/copilot-api']) {
            if (pkg.dependencies?.[dependency]) {
              console.error(`${dependency} must not be a Community production dependency.`);
              process.exit(1);
            }
          }

          for (const [name, command] of Object.entries(scripts)) {
            if (/extensions\/copilot|compile-copilot|watch-copilot|copilot:setup|copilot:get_token/i.test(`${name} ${command}`)) {
              forbidden.push(`${name}: ${command}`);
            }
          }

          if (forbidden.length) {
            console.error('Community Edition default scripts still contain Copilot-specific build/watch entrypoints:');
            for (const item of forbidden) console.error(`  - ${item}`);
            process.exit(1);
          }

          if (fs.existsSync('extensions/copilot/package.json')) {
            console.error('extensions/copilot must not be present in Community Edition.');
            process.exit(1);
          }

          if (!fs.existsSync('extensions/pcl-community/package.json')) {
            console.error('extensions/pcl-community is required for Community Edition M1.');
            process.exit(1);
          }

          const requiredProduct = ['nameShort', 'nameLong', 'applicationName', 'urlProtocol', 'dataFolderName'];
          for (const key of requiredProduct) {
            if (!product[key]) {
              console.error(`product.json missing required key: ${key}`);
              process.exit(1);
            }
          }

          if (!/community/i.test(String(product.nameLong)) && !/community/i.test(String(product.applicationName))) {
            console.error('product.json does not identify Community Edition.');
            process.exit(1);
          }

          if (product.upstreamVersion !== pkg.version || product.upstreamVersion !== '1.133.0') {
            console.error('Upstream Version must match the Code OSS package/API version (1.133.0).');
            process.exit(1);
          }

          if (product.communityRelease !== '0.1.0-alpha') {
            console.error('Community product version must be 0.1.0-alpha.');
            process.exit(1);
          }

          if (product.defaultChatAgent) {
            console.error('product.json must not configure defaultChatAgent / Copilot agent for Community Edition.');
            process.exit(1);
          }

          if (product.enableTelemetry === true) {
            console.error('product.json must not enable telemetry for Community Edition default product config.');
            process.exit(1);
          }

          if (fs.existsSync('tools/pnp-community-cli')) {
            console.error('The placeholder pnp CLI must not replace Public PNPSDK tooling.');
            process.exit(1);
          }

          const pclExtension = JSON.parse(fs.readFileSync('extensions/pcl-community/package.json', 'utf8'));
          if (!pclExtension.contributes?.jsonValidation?.some(item => item.fileMatch?.includes('plugin.json'))) {
            console.error('pcl-community must register the Public PNPSDK plugin.json schema.');
            process.exit(1);
          }

          const commonWorkbench = fs.readFileSync('src/vs/workbench/workbench.common.main.ts', 'utf8');
          const sharedChat = fs.readFileSync('src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts', 'utf8');
          const forbiddenUi = [
            "./contrib/chat/browser/chat.view.js",
            "./contrib/welcomeAgentSessions/browser/agentSessionsWelcome.contribution.js",
            'registerWorkbenchContribution2(ChatStatusBarEntry.ID'
          ];
          if (forbiddenUi.some(marker => commonWorkbench.includes(marker) || sharedChat.includes(marker))) {
            console.error('Community workbench re-enabled an Agent/Chat product surface.');
            process.exit(1);
          }

          console.log('Community product and packaging boundary checks passed.');
          NODE

  m1-plugin-pipeline:
    name: M1 Hello PCL pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Run M1 e2e (build → sign → package → validate)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/pcl-m1-e2e.sh
          ./scripts/pcl-m1-e2e.sh

      - name: Upload Hello PCL package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hello-pcl-package
          path: |
            fixtures/hello-pcl/bin/Release/net10.0/*.pnp
          if-no-files-found: error

  linux-build:
    name: Linux compile and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config \
            libxkbfile-dev \
            libkrb5-dev \
            libsecret-1-dev \
            libgtk-3-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libnss3-dev \
            libasound2-dev

      - name: Install build dependencies
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo "::error::Build dependency installation failed after 5 attempts"
              exit 1
            fi
            echo "Build dependency installation failed on attempt $i; retrying..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        shell: bash
        run: |
          set -euo pipefail
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo "::error::Root dependency installation failed after 5 attempts"
              exit 1
            fi
            echo "Root dependency installation failed on attempt $i; retrying..."
          done
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck client
        run: npm run typecheck-client

      - name: Compile Community Edition
        run: npm run compile

      - name: Compile pcl-community extension
        run: npm run gulp compile-extension:pcl-community

      - name: Validate architectural layers
        run: npm run valid-layers-check

      - name: Verify install did not rewrite tracked files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::Dependency install or build modified tracked files. Commit the generated changes or fix the build."
            exit 1
          fi
