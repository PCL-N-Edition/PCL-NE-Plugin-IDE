name: Community Release

on:
  push:
    tags:
      - 'community-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create artifacts for (e.g. community-v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: Validate and package Community sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Product identity
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./product.json'); console.log(p.nameLong); console.log(p.applicationName); if(!/community/i.test(p.nameLong)) process.exit(1)"

      - name: M1 e2e package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/pcl-m1-e2e.sh
          ./scripts/pcl-m1-e2e.sh

      - name: Stage release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p .build/community-release
          cp fixtures/hello-pcl/dist/com.pcln.hello-pcl-0.1.0.pnp .build/community-release/
          cat > .build/community-release/RELEASE_NOTES.md <<EOF
          # PCL NE Plugin IDE Community Edition ${TAG}

          This release completes **M0 (fork baseline)** and **M1 (plugin project alpha)**.

          ## Highlights

          - Copilot extension and Copilot product packaging removed
          - Built-in extension packaging trimmed for PCL-N plugin development
          - New UI defaults: Dark 2026 / Light 2026 (+ High Contrast)
          - \`pcl-community\` extension: project create, environment check, manifest schema, build/package/validate
          - Reference CLI: \`tools/pnp-community-cli\`
          - Hello PCL fixture e2e package attached

          ## Verification

          - Community boundary checks
          - M1 fixture: build → development sign → package → validate

          ## Notes

          - Full multi-platform Electron installers remain under active pipeline work
          - Chat/Agent host sources still exist for upstream sync cost control and are not productized (no defaultChatAgent)
          - Full Roslyn language service distribution is tracked in ADR-002
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-release-assets
          path: .build/community-release/**

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/community-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            .build/community-release/com.pcln.hello-pcl-0.1.0.pnp
            .build/community-release/RELEASE_NOTES.md
          body_path: .build/community-release/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
