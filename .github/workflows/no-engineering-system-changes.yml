name: Restrict engineering system changes in external PRs

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  engineering-system-policy:
    name: Engineering system policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Detect engineering system changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"

          echo "Changed files:"
          cat "$RUNNER_TEMP/changed-files.txt"

          if grep -Eq '^(\.github/workflows/|build/)|(^|/)package\.json$' "$RUNNER_TEMP/changed-files.txt"; then
            echo "engineering_systems_modified=true" >> "$GITHUB_OUTPUT"
            echo "Engineering system files were modified."
          else
            echo "engineering_systems_modified=false" >> "$GITHUB_OUTPUT"
            echo "No engineering system files were modified."
          fi

      - name: Enforce engineering system policy
        if: ${{ steps.changes.outputs.engineering_systems_modified == 'true' }}
        shell: bash
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Engineering system changes are allowed for trusted repository contributors."
              ;;
            *)
              echo "::error::External PR author '$AUTHOR' ($AUTHOR_ASSOCIATION) cannot modify .github/workflows/, build/, or package.json files."
              exit 1
              ;;
          esac
