name: Community Code Quality

on:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev \
            libkrb5-dev libsecret-1-dev

      - name: Install build dependencies
        working-directory: build
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        shell: bash
        run: |
          set -euo pipefail
          source ./build/azure-pipelines/linux/setup-env.sh
          npm ci
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck build scripts
        working-directory: build
        run: npm run typecheck

      - name: Typecheck and compile Community Edition
        run: |
          npm run typecheck-client
          npm run compile
          npm run gulp compile-extension:pcl-community
          npm run valid-layers-check

      - name: Verify build is reproducible
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::Dependency install or build modified tracked files."
            exit 1
          fi
